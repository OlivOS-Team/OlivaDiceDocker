services:
  olivos-app:
    image: olivosteam/olivadice:latest
    container_name: olivos-main
    volumes:
      - "./data/conf:/app/OlivOS/conf"
      - "./data/plugin:/app/OlivOS/plugin"
      - "./data/logfile:/app/OlivOS/logfile"
      - "./data/resources:/app/OlivOS/data"
      - "./napcat/config:/app/napcat/config"
    environment:
      - LOGIN_UIN=${ACCOUNT}
      - MODE=napcat
    ports:
      - "20480:20480"
      # OlivaDiceWebUI 独立服务版的管理页面，需要的话打开。
      # 别设 OLIVADICE_STANDALONE_WEBUI_PORT，那个环境变量会盖掉面板里的设置。
      # - "8765:8765"
    networks:
      - olivos

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: olivos-${ACCOUNT}
    ports:
      - "6099:6099"
    volumes:
      - "./napcat/config:/app/napcat/config"
      - "./napcat/QQ_DATA:/app/.config/QQ"
      - "./data/resources:/app/OlivOS/data"
      - "./data/plugin:/app/OlivOS/plugin"
    environment:
      - ACCOUNT=${ACCOUNT}
      - MODE=olivos
    networks:
      - olivos

networks:
  olivos:
    driver: bridge
