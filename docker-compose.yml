# OlivOS + NapCat 的组装示例。
# 用法见 README：写好 .env（里面一个 ACCOUNT），然后 docker compose up -d。
#
# 两个容器互相按服务名访问，没有启动顺序要求，先后起来都行。

services:
  olivos-app:
    image: ghcr.io/olivos-team/olivadicedocker:latest
    container_name: olivos-main
    working_dir: /app/OlivOS
    volumes:
      # 程序和数据都在这个目录里。升级时入口脚本只覆盖程序文件，
      # conf/ 与 plugin/data/ 不会被动。
      - "./OlivOS:/app/OlivOS"
      - "./napcat/config:/app/napcat/config"
    environment:
      - LOGIN_UIN=${ACCOUNT}
      - MODE=napcat
    ports:
      # OlivOS 自带的 WebUI，默认监听 20480。登录令牌在 conf/webui_token.txt，
      # 第一次启动时自动生成。
      #
      # 两点要注意：
      #   1. 它默认只绑 127.0.0.1，光映射端口在外面是连不上的，需要在
      #      conf/config.json 里把 models.OlivOS_webUI.server.host 改成 0.0.0.0；
      #   2. 这个功能目前只在预发布通道（0.11.90-alpha.x）里有，稳定版还没有。
      - "20480:20480"
      # OlivaDiceWebUI 独立服务版的管理页面，默认监听 8765。它和上面 OlivOS 自带的
      # WebUI 是两个不同的东西，需要的话自己把这行打开。
      # 端口由插件面板自己维护，所以不要设 OLIVADICE_STANDALONE_WEBUI_PORT——
      # 那个环境变量会盖掉面板里的设置。
      # - "8765:8765"
    networks:
      - olivos

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: olivos-${ACCOUNT}
    ports:
      - "6099:6099"
    volumes:
      - "./napcat/config:/app/napcat/config"
      - "./napcat/QQ_DATA:/app/.config/QQ"
      - "./OlivOS:/app/OlivOS"
    environment:
      - ACCOUNT=${ACCOUNT}
      - MODE=olivos
    networks:
      - olivos

networks:
  olivos:
    driver: bridge
