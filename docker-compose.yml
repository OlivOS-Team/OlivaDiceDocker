# OlivOS + NapCat 的组装示例。
# 用法见 README：写好 .env（里面一个 ACCOUNT），然后 docker compose up -d。

services:
  olivos-app:
    image: ghcr.io/olivos-team/olivadicedocker:latest
    container_name: olivos-main
    working_dir: /app/OlivOS
    volumes:
      # 程序和数据都在这个目录里。升级时入口脚本只覆盖程序文件，
      # conf/ 与 plugin/data/ 不会被动。
      - "./OlivOS:/app/OlivOS"
      - "./napcat/config:/app/napcat/config"
    environment:
      - LOGIN_UIN=${ACCOUNT}
      - MODE=napcat
    ports:
      # OlivaDiceWebUI 独立服务版的管理页面。
      # 监听端口由插件自己维护，这里只做映射——不要设
      # OLIVADICE_STANDALONE_WEBUI_PORT，那个环境变量会盖掉面板里的设置。
      - "8765:8765"
    networks:
      - olivos
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: olivos-${ACCOUNT}
    ports:
      - "6099:6099"
    volumes:
      - "./napcat/config:/app/napcat/config"
      - "./napcat/QQ_DATA:/app/.config/QQ"
      - "./OlivOS:/app/OlivOS"
    environment:
      - ACCOUNT=${ACCOUNT}
      - MODE=olivos
    networks:
      - olivos
    mac_address: "02:42:16:74:4c:b0"

networks:
  olivos:
    driver: bridge
